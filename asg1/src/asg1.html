<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Draw Shapes</title>
    <style>
      .active-mode {
        background-color: #555;
        color: white;
        outline: 2px solid #000;
      }
    </style>
  </head>

  <body onload="main()">
    <canvas id="webgl" width="400" height="400">
    Please use a browser that supports "canvas"
    </canvas>

    <p>Nick Lafredo     nlafredo@ucsc.edu</p>

    <p>
    <button type = "button" id = "green">Green</button>
    <button type = "button" id = "red">Red</button>
    <button type = "button" id = "blue">Blue</button>
    <button type = "button" id = "clear">Clear</button>
    <p>

    <button type = "button" id = "point">Point</button>
    <button type = "button" id = "triangle">Triangle</button>
    <button type = "button" id = "circle">Circle</button>
    <p>


    <button type = "button" id = "ghost">GHOST MODE</button>
    <button type = "button" id = "totoro">Totoro</button>

    <p>
    Ghost Speed <input type="range" min="1" max="100" value="10" class="slider" id="ghostSpeedSlide">


    <p>
    Red <input type = "range" min = "0" max = "100" value = "100" class = "slider" id = "redSlide">
    <p>
    Green <input type = "range" min = "0" max = "100" value = "100" class = "slider" id = "greenSlide">
    <p>
    Blue <input type = "range" min = "0" max = "100" value = "100" class = "slider" id = "blueSlide">
    <p>
    Alpha <input type = "range" min = "0" max = "100" value = "100" class = "slider" id = "alphaSlide">

    <p>
    Size <input type = "range" min = "5" max = "40" value = "20" class = "slider" id = "sizeSlide">
    <p>
    Segments <input type = "range" min = "5" max = "25" value = "10" class = "slider" id = "segmentSlide">
    <p>

    Current Color: <div id = "colorPreview" style = "display:inline-block; width:40px; height:40px; 
                              background-color: rgb(0, 0, 0); border: 1px solid white;"></div>
  


    <script src="../lib/webgl-utils.js"></script>
    <script src="../lib/webgl-debug.js"></script>
    <script src="../lib/cuon-utils.js"></script>
    <script src ="point.js"></script>
    <script src ="triangle.js"></script>
    <script src ="circle.js"></script>
    <script src ="totoro.js"></script>
    <script src="asg1.js"></script>
  </body>
</html>
